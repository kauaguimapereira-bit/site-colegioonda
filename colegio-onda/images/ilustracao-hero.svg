      <ellipse cx="60" cy="86" rx="70" ry="10" fill="#123334" opacity=".12"/>
      <path d="M0 90 C -4 55, 10 40, 40 38 C 72 36, 92 52, 92 82 C 92 90, 84 90, 84 90 Z" fill="#123334"/>
      <circle cx="34" cy="20" r="18" fill="#123334"/>
      <path d="M20 46 C 40 60, 66 58, 82 44 L 86 70 C 64 84, 34 84, 14 70 Z" fill="#F2A93C"/>
    </g>
  </g>
</svg>
